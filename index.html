<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080c12">
  <title>Casa — teste VIDAA</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: #f6f7fa; background: #080c12; }
    .backdrop { position: fixed; inset: 0; background: radial-gradient(ellipse at 77% 18%, #435670 0, #1a2938 23%, transparent 52%), radial-gradient(ellipse at 15% 75%, #233c46 0, transparent 40%), linear-gradient(120deg,#101923,#090d13 60%); }
    .shade { position: fixed; inset: 0; background: linear-gradient(90deg,rgba(5,9,14,.94) 0%,rgba(5,9,14,.62) 42%,rgba(5,9,14,.05) 100%),linear-gradient(0deg,#080c12 2%,transparent 48%,rgba(8,12,18,.38)); }
    main { position: relative; width: min(100%,1920px); height: 100vh; min-height: 640px; margin: auto; padding: 34px 6.4vw 44px; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 44px; height: 58px; }
    .brand { font-size: 24px; font-weight: 800; letter-spacing: .16em; margin-right: 12px; color: #fff; }
    nav { display: flex; gap: 9px; }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    .nav { background: transparent; border-radius: 28px; padding: 13px 19px; font-size: 17px; color: #d5dbe3; }
    .nav.active { background: #f3f5f8; color: #121821; font-weight: 700; }
    .spacer { flex: 1; }
    .clock { font-size: 18px; color: #e8edf2; }
    .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 15px; }
    .eyebrow { color: #c7d6e4; font-size: 15px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 17px; }
    h1 { font-size: clamp(42px,6.2vw,84px); line-height: .98; letter-spacing: -.045em; max-width: 780px; margin: 0 0 18px; }
    .summary { max-width: 650px; color: #d0d8e1; font-size: clamp(18px,2vw,24px); line-height: 1.45; margin: 0 0 26px; }
    .hint { display: inline-flex; align-items: center; gap: 12px; color: #f6f8fb; font-size: 16px; }
    .key { display: inline-grid; place-items: center; width: 37px; height: 37px; border: 1px solid #cad5dfaa; border-radius: 50%; background: #ffffff15; font-weight: 800; }
    .section-title { font-size: 17px; color: #e0e6ed; margin: 0 0 15px 2px; }
    .apps { display: flex; gap: clamp(14px,2.1vw,32px); align-items: center; }
    .app { width: clamp(92px,10vw,142px); height: clamp(92px,10vw,142px); border-radius: 24px; display: grid; place-items: center; text-align: center; background: linear-gradient(145deg,#242c37,#111820); border: 1px solid #ffffff20; box-shadow: 0 12px 30px #0005; transition: transform .18s,border-color .18s,box-shadow .18s; }
    .app span { font-size: clamp(15px,1.6vw,22px); font-weight: 800; letter-spacing: -.03em; }
    .app[data-color="red"] span { color: #ff3445; }
    .app[data-color="blue"] span { color: #71c6ff; }
    .app[data-color="gold"] span { color: #f8d48b; }
    .app[data-color="green"] span { color: #7bd3a4; }
    .focusable:focus { outline: 4px solid #fff; outline-offset: 5px; transform: scale(1.08); box-shadow: 0 18px 40px #0009,0 0 26px #ffffff33; }
    footer { display: flex; justify-content: space-between; align-items: center; color: #aab4c0; font-size: 13px; margin-top: 25px; }
    #toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%,20px); opacity: 0; background: #f4f6f8; color: #111820; padding: 15px 22px; border-radius: 12px; font-size: 17px; font-weight: 700; transition: .2s; pointer-events: none; box-shadow: 0 10px 35px #0009; }
    #toast.show { opacity: 1; transform: translate(-50%,0); }
    @media (max-height:700px) { main { padding-top: 20px; padding-bottom: 22px; } .hero { padding-top: 20px; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
  <main>
    <header>
      <div class="brand">CASA</div>
      <nav aria-label="Seções">
        <button class="nav active focusable" data-category="inicio">Início</button>
        <button class="nav focusable" data-category="filmes">Filmes</button>
        <button class="nav focusable" data-category="series">Séries</button>
        <button class="nav focusable" data-category="musica">Música</button>
        <button class="nav focusable" data-category="apps">Apps</button>
      </nav>
      <div class="spacer"></div><div class="clock" id="clock">--:--</div>
    </header>
    <section class="hero" aria-labelledby="title">
      <div class="eyebrow">Sua sala, sua seleção</div>
      <h1 id="title">Tudo começa<br>por aqui.</h1>
      <p class="summary" id="summary">Interface de teste para a sua Hisense. Use as setas do controle e pressione OK para navegar pelas categorias.</p>
      <div class="hint"><span class="key">OK</span> <span>Escolha um atalho para abrir o serviço</span></div>
    </section>
    <section aria-label="Aplicativos de exemplo">
      <p class="section-title" id="sectionTitle">Seus aplicativos</p>
      <div class="apps">
        <button class="app focusable" data-color="red"><span>NETFLIX</span></button>
        <button class="app focusable" data-color="red"><span>YouTube</span></button>
        <button class="app focusable" data-color="blue"><span>prime<br>video</span></button>
        <button class="app focusable" data-color="gold"><span>Disney+</span></button>
        <button class="app focusable" data-color="green"><span>Música</span></button>
      </div>
    </section>
    <footer><span>CASA · protótipo de navegação</span><span>Voltar: tecla Back · Esc</span></footer>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    const clock = document.getElementById('clock');
    const updateClock = () => clock.textContent = new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date());
    updateClock(); setInterval(updateClock,15000);
    const navButtons = [...document.querySelectorAll('.nav')];
    const appButtons = [...document.querySelectorAll('.app')];
    const focusables = [...document.querySelectorAll('.focusable')];
    const categories = {
      inicio: { title:'Tudo começa<br>por aqui.', summary:'Interface de teste para a sua Hisense. Use as setas do controle e pressione OK para navegar pelas categorias.', section:'Seus aplicativos', items:['NETFLIX','YouTube','prime<br>video','Disney+','Música'] },
      filmes: { title:'Uma noite<br>de cinema.', summary:'Uma área para reunir seus filmes e serviços de vídeo favoritos.', section:'Filmes e serviços', items:['Ação','Drama','Comédia','Aventura','Favoritos'] },
      series: { title:'Sua próxima<br>série começa aqui.', summary:'Deixe séries, episódios e novidades ao alcance do controle.', section:'Séries', items:['Continuar','Novidades','Drama','Comédia','Favoritas'] },
      musica: { title:'Dê o play<br>na sua música.', summary:'Atalhos visuais para música, rádio e playlists.', section:'Música e áudio', items:['Spotify','YouTube','Rádio','Playlists','Favoritas'] },
      apps: { title:'Seus apps,<br>em um só lugar.', summary:'Uma tela inicial simples, com navegação por setas e foco visível.', section:'Aplicativos', items:['NETFLIX','YouTube','prime<br>video','Disney+','Mais apps'] }
    };
    const serviceUrls = {
      'netflix': 'https://www.netflix.com/',
      'youtube': 'https://www.youtube.com/tv',
      'prime video': 'https://app.primevideo.com/',
      'disney+': 'https://www.disneyplus.com/',
      'música': 'https://open.spotify.com/',
      'spotify': 'https://open.spotify.com/'
    };
    const toast = document.getElementById('toast'); let timer;
    function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(()=>toast.classList.remove('show'),1800); }
    function selectCategory(key) {
      const data = categories[key]; if (!data) return;
      document.getElementById('title').innerHTML = data.title;
      document.getElementById('summary').textContent = data.summary;
      document.getElementById('sectionTitle').textContent = data.section;
      appButtons.forEach((button,i) => button.querySelector('span').innerHTML = data.items[i]);
      navButtons.forEach(button => button.classList.toggle('active',button.dataset.category === key));
    }
    function activate(el) {
      if (el?.dataset.category) selectCategory(el.dataset.category);
      else if (el?.classList.contains('app')) {
        const label = el.querySelector('span')?.innerText.replace(/\s+/g, ' ').trim().toLowerCase();
        const url = serviceUrls[label];
        if (url) window.location.assign(url);
        else notify('Este cartão ainda não tem um serviço associado.');
      }
    }
    document.addEventListener('keydown', e => {
      const current = document.activeElement;
      if (['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) {
        e.preventDefault();
        let i = Math.max(0,focusables.indexOf(current));
        if (e.key === 'ArrowRight') i = (i + 1) % focusables.length;
        if (e.key === 'ArrowLeft') i = (i - 1 + focusables.length) % focusables.length;
        if (e.key === 'ArrowDown') i = Math.min(focusables.length - 1, i + 3);
        if (e.key === 'ArrowUp') i = Math.max(0, i - 3);
        focusables[i].focus();
      } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(current); }
      else if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'BrowserBack') { e.preventDefault(); notify('Volta para a tela inicial da TV pelo botão Voltar.'); }
    });
    focusables.forEach(el => el.addEventListener('click',()=>activate(el)));
    focusables[0].focus();
  </script>
</body>
</html>
